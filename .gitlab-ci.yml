stages:
  - validate
  - test
  - build
  - deploy_preview
  - deploy_pages

default:
  image: node:22-bookworm
  tags:
    - mac-mini
    - docker
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

variables:
  NEXT_TELEMETRY_DISABLED: "1"
  NO_COLOR: "1"
  VERCEL_CLI_VERSION: "56.3.2"
  VERCEL_ORG_ID: "team_CczJOjtPJm7x5HiMADhsAkYb"
  VERCEL_PROJECT_ID: "prj_BSarJ0dL2TCvoKRSbTJnuiWCqnYX"
  NEXT_PUBLIC_API_BASE_URL: "https://api.nulanesystems.com/inspection-trac/api"
  GITHUB_PAGES_REPOSITORY: "Traumadogwoodworking/inspection-trac.git"
  GITHUB_PAGES_BRANCH: "gh-pages"

lint:
  stage: validate
  script:
    - npm run lint

typecheck:
  stage: validate
  script:
    - npx tsc --noEmit

unit_tests:
  stage: test
  variables:
    NEXT_PUBLIC_PORTAL_DEV_SESSION_BYPASS: "1"
  script:
    - npm test
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - coverage/
      - test-results/

e2e_smoke:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
    - when: never
  variables:
    NEXT_PUBLIC_PORTAL_DEV_SESSION_BYPASS: "1"
  script:
    - npx playwright install --with-deps chromium
    - npx playwright test
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - playwright-report/
      - test-results/

static_export:
  stage: build
  variables:
    NEXT_PUBLIC_PORTAL_DEV_SESSION_BYPASS: "1"
  script:
    - npm run build
    - npm run export:validate
    - tar -czf portal-static-${CI_COMMIT_SHA}.tar.gz out
    - sha256sum portal-static-${CI_COMMIT_SHA}.tar.gz > portal-static-${CI_COMMIT_SHA}.tar.gz.sha256
    - sha256sum -c portal-static-${CI_COMMIT_SHA}.tar.gz.sha256
  artifacts:
    expire_in: 30 days
    paths:
      - out/
      - portal-static-${CI_COMMIT_SHA}.tar.gz
      - portal-static-${CI_COMMIT_SHA}.tar.gz.sha256

deploy_vercel_preview:
  stage: deploy_preview
  needs:
    - lint
    - typecheck
    - unit_tests
  resource_group: inspection-trac-vercel-preview
  environment:
    name: preview/$CI_COMMIT_REF_SLUG
    url: $VERCEL_DEPLOYMENT_URL
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^codex\/nulane-portal-vercel-preview-/'
    - when: never
  script:
    - test -n "$VERCEL_TOKEN"
    - npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=preview --token="$VERCEL_TOKEN"
    - npx --yes "vercel@${VERCEL_CLI_VERSION}" build --token="$VERCEL_TOKEN"
    - deployment_url="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --token="$VERCEL_TOKEN")"
    - test -n "$deployment_url"
    - printf 'VERCEL_DEPLOYMENT_URL=%s\n' "$deployment_url" | tee deploy.env
    - npx --yes "vercel@${VERCEL_CLI_VERSION}" inspect "$deployment_url" --token="$VERCEL_TOKEN"
  artifacts:
    reports:
      dotenv: deploy.env
    expire_in: 30 days
    paths:
      - deploy.env

deploy_github_pages:
  image: alpine:3.20
  stage: deploy_pages
  needs:
    - static_export
  before_script:
    - apk add --no-cache git openssh-client rsync
    - test -n "$GITHUB_PAGES_SSH_KEY_B64"
    - test -n "$GITHUB_PAGES_KNOWN_HOSTS"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s' "$GITHUB_PAGES_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - printf '%s\n' "$GITHUB_PAGES_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
    - export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
  resource_group: inspection-trac-gh-pages
  environment:
    name: github-pages-production
    url: https://inspection-trac.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
  script:
    - test -f out/index.html
    - test -d out/_next
    - test "$(cat out/CNAME)" = "inspection-trac.com"
    - test -f out/.nojekyll
    - publish_dir="$(mktemp -d)"
    - git clone --branch "$GITHUB_PAGES_BRANCH" --single-branch "git@github.com:${GITHUB_PAGES_REPOSITORY}" "$publish_dir"
    - rsync -a --delete --exclude=.git out/ "$publish_dir/"
    - cd "$publish_dir"
    - test "$(cat CNAME)" = "inspection-trac.com"
    - test -f .nojekyll
    - test -f index.html
    - test -d _next
    - git config user.name "Nulane GitLab Pages Publisher"
    - git config user.email "gitlab-pages@nulanesystems.local"
    - git add --all
    - git diff --cached --quiet || git commit -m "Publish portal ${CI_COMMIT_SHA}"
    - git push origin "$GITHUB_PAGES_BRANCH"

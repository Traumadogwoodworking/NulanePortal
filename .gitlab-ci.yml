stages:
  - validate
  - test
  - build
  - deploy

default:
  image: node:22-bookworm
  tags:
    - mac-mini
    - docker
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

variables:
  NEXT_TELEMETRY_DISABLED: "1"
  NO_COLOR: "1"
  VERCEL_CLI_VERSION: "56.3.2"
  VERCEL_ORG_ID: "team_CczJOjtPJm7x5HiMADhsAkYb"
  VERCEL_PROJECT_ID: "prj_BSarJ0dL2TCvoKRSbTJnuiWCqnYX"
  NEXT_PUBLIC_API_BASE_URL: "https://api.nulanesystems.com/inspection-trac/api"

lint:
  stage: validate
  script:
    - npm run lint

typecheck:
  stage: validate
  script:
    - npx tsc --noEmit

unit_tests:
  stage: test
  variables:
    NEXT_PUBLIC_PORTAL_DEV_SESSION_BYPASS: "1"
  script:
    - npm test
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - coverage/
      - test-results/

e2e_smoke:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
    - when: never
  variables:
    NEXT_PUBLIC_PORTAL_DEV_SESSION_BYPASS: "1"
  script:
    - npx playwright install --with-deps chromium
    - npx playwright test
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - playwright-report/
      - test-results/

vercel_build:
  stage: build
  needs:
    - lint
    - typecheck
    - unit_tests
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "cicd/vercel-dev-cors"'
    - when: never
  script:
    - test -n "$VERCEL_TOKEN"
    - npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production
    - npx --yes "vercel@${VERCEL_CLI_VERSION}" build --prod
  artifacts:
    expire_in: 30 days
    paths:
      - .vercel/output/

deploy_vercel_production:
  stage: deploy
  needs:
    - vercel_build
  resource_group: inspection-trac-vercel-production
  environment:
    name: vercel-production
    url: https://inspection-trac-portal-dev.vercel.app
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "cicd/vercel-dev-cors"'
    - when: never
  script:
    - test -n "$VERCEL_TOKEN"
    - deployment_url="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod)"
    - test -n "$deployment_url"
    - printf 'VERCEL_DEPLOYMENT_URL=%s\n' "$deployment_url" | tee deploy.env
    - npx --yes "vercel@${VERCEL_CLI_VERSION}" inspect "$deployment_url"
    - VERCEL_DEPLOYMENT_URL="$deployment_url" node -e 'const url = process.env.VERCEL_DEPLOYMENT_URL + "/inspection/24-hour/"; fetch(url).then((response) => { if (!response.ok) throw new Error(`${url} returned ${response.status}`); console.log(`inspection_24_hour_publish_probe status=${response.status} url=${url}`); })'
  artifacts:
    reports:
      dotenv: deploy.env
    expire_in: 30 days
    paths:
      - deploy.env

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Definian Inspection</title>
    <script>
      (function () {
        var match = window.location.pathname.match(/^(.*)\/join\/([^/]+)\/?$/i);
        if (!match) return;
        var prefix = match[1] || "";
        var slug = decodeURIComponent(match[2]);
        window.location.replace(prefix + "/join/?facility=" + encodeURIComponent(slug));
      })();
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; color: #0f172a; background: #f1f5f9; }
      main { max-width: 34rem; margin: 2rem; padding: 2rem; border: 1px solid #cbd5e1; border-radius: 1.5rem; background: white; text-align: center; }
    </style>
  </head>
  <body>
    <main><h1>Page not found</h1><p>Check the address or return to the Definian Inspection portal.</p></main>
  </body>
</html>

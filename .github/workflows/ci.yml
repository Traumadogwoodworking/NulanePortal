name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_PORTAL_DEV_SESSION_BYPASS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: "npm"
      - name: Install dependencies
        run: npm_config_registry=https://registry.npmmirror.com npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run CI script
        run: npm run ci

name: Deploy Inspection-Trac Portal

on:
  workflow_dispatch:
  push:
    branches:
      - feature/inspection-trac-quick-branding

permissions:
  contents: write

concurrency:
  group: inspection-trac-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Ensure GitHub Pages static serving
        run: touch out/.nojekyll

      - name: Remove export debug dumps
        run: find out -type f \( -name "*.txt" -o -name "*.log" -o -name "*transcript*" \) -delete

      - name: Validate export artifact
        run: |
          test -f out/index.html
          test -f out/404.html
          test -f out/.nojekyll
          test -d out/_next/static
          ! grep -R "/portal/_next" -n out
          grep -R "/inspection-trac/_next" -n out | head
          BAD_FILES="$(find out -type f \( -name "*.log" -o -name "*transcript*" -o -name "__next.*" -o -name "__next._*" -o -name "*.txt" \))"
          if [ -n "$BAD_FILES" ]; then
            echo "$BAD_FILES"
            exit 1
          fi

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./out
          force_orphan: true
